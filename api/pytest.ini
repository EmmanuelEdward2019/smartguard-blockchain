[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning

# web3 registers a pytest plugin, web3.tools.pytest_ethereum, through its entry
# points, so pytest imports it on every run. At web3 6.11 that module imports
# `ContractName` from eth_typing, which the installed eth_typing no longer
# exports, and collection dies before a single test runs. Nothing here uses the
# plugin, so it is switched off rather than web3 being moved off the version
# Table 3.3 names.
addopts = -p no:pytest_ethereum
